name: vla_nav tests

on:
  push:
    paths:
      - 'vla_nav/**'
      - '.github/workflows/vla_nav-tests.yml'
  pull_request:
    paths:
      - 'vla_nav/**'
      - '.github/workflows/vla_nav-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: vla_nav
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖（pytest 只是 runner，业务代码零依赖）
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: standalone runner（模拟机器人机：没有 pytest）
        run: python run_tests.py --standalone

      - name: pytest runner
        run: python run_tests.py --pytest

      - name: 语法 + 离线几何链路自检
        run: |
          python grounding.py --dry-run --box 300 200 380 300 --depth 2.0 \
            --intrinsics 600 600 320 240 --camera-pose 1 2 0.3 0 --robot 0 0
